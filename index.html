<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Canvas</title>
<style>
  :root { --bg:#0f1724; --accent:#22d3ee; --ok:#4ade80; --text:#e8f1f8; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0%, #1e3a5f, var(--bg)); color:var(--text);
         font-family:system-ui, sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { margin:8px 0 4px; color:var(--accent); }
  #status { color:var(--ok); min-height:1.4em; margin:6px 0 12px; text-align:center; font-weight:600; }
  #stage { position:relative; width:min(100%, 880px); aspect-ratio:4/3; border:3px solid var(--accent); border-radius:14px;
           overflow:hidden; background:#000; box-shadow:0 0 24px rgba(34,211,238,.35); touch-action:none; }
  #stage video, #stage canvas { position:absolute; inset:0; width:100%; height:100%; }
  #video, #hand, #draw { transform:scaleX(-1); }
  #video { object-fit:cover; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; margin-top:14px; }
  button, select, input[type=color] { padding:10px 16px; border-radius:8px; border:0; background:#a5f3fc; color:#083344;
           font-weight:600; cursor:pointer; font-size:15px; }
  input[type=color] { padding:2px; width:48px; height:42px; }
  button:hover { background:#67e8f9; }
  label { display:flex; align-items:center; gap:6px; font-size:14px; }
</style>
</head>
<body>
  <h1>🎨 Air Canvas</h1>
  <div>Draw in the air using your index finger!</div>
  <div id="status">Press “Start Camera” to begin.</div>

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="draw"></canvas>
    <canvas id="hand"></canvas>
  </div>

  <div class="bar">
    <button id="startBtn">Start Camera</button>
    <button id="clearBtn">Clear Canvas</button>
    <button id="saveBtn">Save PNG</button>
    <label>Color <input type="color" id="color" value="#22d3ee"></label>
    <label>Size <input type="range" id="size" min="2" max="20" value="6"></label>
    <label>Shape
      <select id="shape">
        <option value="free">Freehand</option>
        <option value="line">Line</option>
        <option value="rect">Rectangle</option>
        <option value="circle">Circle</option>
      </select>
    </label>
    <label><input type="checkbox" id="showHand" checked> Show hand model</label>
    <label><input type="checkbox" id="showVideo" checked> Show camera</label>
  </div>

<script type="module">
import { HandLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const W = 960, H = 720;
const $ = id => document.getElementById(id);
const video = $('video');
const drawC = $('draw'), handC = $('hand');
const dctx = drawC.getContext('2d'), hctx = handC.getContext('2d');
drawC.width = handC.width = W; drawC.height = handC.height = H;
const utils = new DrawingUtils(hctx);

let landmarker = null, running = false;
let prev = null, anchor = null, preview = null, smooth = null, lastTime = -1;

const setStatus = t => { $('status').textContent = t; };

function styleCtx(ctx){
  ctx.strokeStyle = $('color').value;
  ctx.lineWidth = +$('size').value;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
}
function drawShape(ctx, type, a, b){
  ctx.beginPath();
  if (type === 'line'){ ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); }
  else if (type === 'rect'){ ctx.rect(a.x,a.y,b.x-a.x,b.y-a.y); }
  else if (type === 'circle'){ ctx.arc(a.x,a.y,Math.hypot(b.x-a.x,b.y-a.y),0,Math.PI*2); }
  ctx.stroke();
}
function finishShape(){
  if (anchor && preview){ styleCtx(dctx); drawShape(dctx, $('shape').value, anchor, preview); }
  anchor = null; preview = null;
}

const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const extended = (lm, tip, pip) => dist(lm[0], lm[tip]) > dist(lm[0], lm[pip]) * 1.05;

function handleHand(lm){
  if ($('showHand').checked){
    utils.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS, { color:'#4ade80', lineWidth:3 });
    utils.drawLandmarks(lm, { color:'#f43f5e', radius:4 });
  }
  const raw = { x: lm[8].x * W, y: lm[8].y * H };
  smooth = smooth ? { x: smooth.x*0.5 + raw.x*0.5, y: smooth.y*0.5 + raw.y*0.5 } : raw;
  const tip = smooth;

  const indexUp  = extended(lm, 8, 6);
  const middleUp = extended(lm, 12, 10);
  const drawing  = indexUp && !middleUp;
  const shape = $('shape').value;

  if (drawing){
    setStatus('✏️ Drawing');
    styleCtx(dctx);
    if (shape === 'free'){
      if (prev){ dctx.beginPath(); dctx.moveTo(prev.x,prev.y); dctx.lineTo(tip.x,tip.y); dctx.stroke(); }
      prev = { x: tip.x, y: tip.y };
    } else {
      if (!anchor) anchor = { x: tip.x, y: tip.y };
      preview = { x: tip.x, y: tip.y };
      styleCtx(hctx); drawShape(hctx, shape, anchor, preview);
    }
    hctx.beginPath(); hctx.fillStyle = $('color').value; hctx.arc(tip.x,tip.y,8,0,Math.PI*2); hctx.fill();
  } else {
    setStatus(indexUp ? '⏸ Paused (index + middle up)' : '⏸ Hand found — raise only your index finger to draw');
    prev = null; finishShape();
    hctx.beginPath(); hctx.strokeStyle = '#fff'; hctx.lineWidth = 2; hctx.arc(tip.x,tip.y,10,0,Math.PI*2); hctx.stroke();
  }
}

function loop(){
  if (!running) return;
  if (video.readyState >= 2 && video.currentTime !== lastTime){
    lastTime = video.currentTime;
    hctx.clearRect(0,0,W,H);
    const res = landmarker.detectForVideo(video, performance.now());
    if (res.landmarks && res.landmarks.length){
      handleHand(res.landmarks[0]);
    } else {
      prev = null; smooth = null; finishShape();
      setStatus('No hand detected — show your open palm to the camera');
    }
  }
  requestAnimationFrame(loop);
}

async function createLandmarker(delegate){
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  return HandLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate
    },
    runningMode: "VIDEO",
    numHands: 1,
    minHandDetectionConfidence: 0.4,
    minHandPresenceConfidence: 0.4,
    minTrackingConfidence: 0.4
  });
}

async function start(){
  if (running) return;
  try {
    setStatus('1/3 Asking for camera permission…');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
    video.srcObject = stream;
    await video.play();

    setStatus('2/3 Loading hand model… (can take 10–30 seconds)');
    try { landmarker = await createLandmarker("GPU"); }
    catch (e){ console.warn('GPU failed, using CPU', e); landmarker = await createLandmarker("CPU"); }

    setStatus('3/3 Ready! Show your hand.');
    running = true;
    loop();
  } catch (e){
    console.error(e);
    setStatus('❌ ' + (e.name || 'Error') + ': ' + e.message);
  }
}

// Backup: draw with mouse / touch
let down = false, mprev = null;
const pointer = e => {
  const r = drawC.getBoundingClientRect();
  return { x: (1 - (e.clientX - r.left) / r.width) * W, y: (e.clientY - r.top) / r.height * H };
};
$('stage').addEventListener('pointerdown', e => { down = true; mprev = pointer(e); });
$('stage').addEventListener('pointermove', e => {
  if (!down) return;
  const p = pointer(e); styleCtx(dctx);
  dctx.beginPath(); dctx.moveTo(mprev.x,mprev.y); dctx.lineTo(p.x,p.y); dctx.stroke(); mprev = p;
});
window.addEventListener('pointerup', () => { down = false; });

$('startBtn').onclick = start;
$('clearBtn').onclick = () => { dctx.clearRect(0,0,W,H); prev = anchor = preview = null; };
$('showVideo').onchange = e => { video.style.visibility = e.target.checked ? 'visible' : 'hidden'; };
$('saveBtn').onclick = () => {
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const o = out.getContext('2d');
  o.translate(W,0); o.scale(-1,1);
  if ($('showVideo').checked && video.videoWidth) o.drawImage(video,0,0,W,H);
  else { o.fillStyle = '#000'; o.fillRect(0,0,W,H); }
  o.drawImage(drawC,0,0);
  const a = document.createElement('a');
  a.download = 'air-canvas.png'; a.href = out.toDataURL('image/png'); a.click();
};
</script>
</body>
</html>
